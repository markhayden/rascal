# rascal.toml: the configuration a pipeline gives rascal (docs/recipes.md, docs/fillers.md, docs/tools.md).
config_version = 1

[workspace]                                      # where runs keep their workspace when --workspace is not given
dir = "ws"

# A local filler: a command with placeholders. Exit 0 and a PNG at {out} of the request's size.
[fillers.local-inpaint]
command = ["python", "fill.py", "{image}", "{mask}", "{out}"]
profile = "grey"                                 # the rendering it takes: grey or binary (mask input), alpha or tinted (image input)
paste = "feather"                                # how its result is composited: feather, hard or poisson (docs/masks.md)
timeout_s = 120
revision = "fill.py 2026-10-28"                  # free text the lab hashes into cell identity; required for lab use

# A hosted filler: a multipart POST (image, mask when the profile has one, prompt when given); a PNG back.
[fillers.hosted]
url = "https://example.invalid/inpaint"
profile = "binary"
paste = "hard"
key_env = "HOSTED_FILLER_KEY"                    # Authorization: Bearer, read at call time; never stored, logged or journaled
timeout_s = 180
max_side = 2048                                  # the heal graph windows to it; the support must fit
revision = "vendor model 2026-10"

# The testkit's fake, for trying heal without a model (build with --features testkit):
# [fillers.fake]
# command = ["rascal", "fake-filler", "exact", "{image}", "{mask}", "{out}"]
# profile = "grey"

# A tool pack: a process speaking MCP over stdio (docs/tools.md "The packs"). Its environment is
# PATH, HOME, LANG, LC_ALL, TMPDIR plus `env`, minus every filler's key_env and every *_KEY,
# *_TOKEN, *_SECRET name; removal wins over declaration.
[packs.rascal-tools]
command = ["/opt/rascal-tools/.venv/bin/rascal-tools", "serve"]
env = ["RASCAL_TOOLS_MODELS"]
accepts = "path"                                 # or base64
concurrent = false                               # effective only when the tool's manifest agrees
revision = "segmenter export 2026-10"            # the lab hashes it into cell identity; required for lab use
startup_timeout_s = 60
call_timeout_s = 120

# The testkit's fake pack, for trying the client without a model (build with --features testkit):
# [packs.fake]
# command = ["rascal", "fake-pack", "exact"]

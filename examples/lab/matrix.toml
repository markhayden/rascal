# A matrix (docs/lab.md): the corpus and protocol it runs under (paths relative to this file),
# the seed (the protocol's), the images with what their recipes need, and the arms. A cell is
# one arm on one image; `rascal lab run examples/lab/matrix.toml --config <rascal.toml> --out
# lab/demo/` heals every cell through the arm's filler. Per-image `inputs` bind recipe inputs
# to files; `overrides` set step parameters, `"<step>.<param>" = value`, with
# `"<step>.constants"` selecting a constant set.
version = 1
name = "seam-demo"
corpus = "corpus.toml"
protocol = "protocol.toml"
seed = 20261028

[[image]]
id = "sky-01"

[[image]]
id = "sky-02"

[[image]]
id = "structured-01"

[[image]]
id = "structured-02"

[[arm]]
name = "thin"
recipe = "seam"
overrides = { "fan.constants" = "fan-thin-v1" }
filler = "fake"
spend_usd_per_call = 0.0

[[arm]]
name = "fan-ramp"
recipe = "seam"
filler = "fake"

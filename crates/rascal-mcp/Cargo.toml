[package]
name = "rascal-mcp"
description = "rascal mcp: the MCP client for tool packs and the server behind `rascal serve` (library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rascal-core = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
image = { workspace = true }
# Bundle digests (`provision`).
sha2 = { workspace = true }
# SIGTERM in the shutdown escalation (stdin close, SIGTERM, SIGKILL); already in rmcp's tree.
nix = { version = "0.31", default-features = false, features = ["signal"] }
tracing = { workspace = true }
tokio-util = "0.7"

[lints]
workspace = true

[dev-dependencies]
rascal-testkit = { path = "../rascal-testkit" }
image = { workspace = true }

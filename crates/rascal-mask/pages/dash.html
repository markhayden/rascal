<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rascal run page</title>
<style>
  :root { --bg: #fbfaf8; --fg: #1f1d1a; --muted: #6b6560; --line: #e2ddd6; --accent: #b0158f; --warn: #b8640a; --bad: #b3261e; --ok: #2d7a3a; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16151a; --fg: #ebe7e1; --muted: #9b958d; --line: #2d2b31; --accent: #e06bcd; --warn: #e3a040; --bad: #ff7b72; --ok: #6ccf7a; --card: #1f1e24; } }
  html { color-scheme: light dark; }
  body { margin: 0; padding: 24px max(16px, 3vw); background: var(--bg); color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 24px 0 8px; }
  .meta { color: var(--muted); } .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); margin-left: 6px; }
  .rebuilt { border-color: var(--warn); color: var(--warn); }
  table { border-collapse: collapse; width: 100%; } td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; } th { color: var(--muted); font-weight: 600; }
  .bar { height: 10px; background: var(--accent); border-radius: 2px; min-width: 2px; } .bar.na { background: var(--warn); } .bar.failed { background: var(--bad); } .bar.note { background: var(--muted); }
  .repeat { color: var(--warn); } .status-ok { color: var(--ok); } .status-not_applicable { color: var(--warn); } .status-invalid_args { color: var(--bad); }
  details { margin: 6px 0; } summary { cursor: pointer; } pre { background: var(--card); border: 1px solid var(--line); padding: 8px; overflow-x: auto; font-size: 12px; max-height: 260px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; } .thumbs figure { margin: 0; width: 120px; } .thumbs img { width: 120px; height: auto; border: 1px solid var(--line); background: #888; image-rendering: pixelated; } figcaption { font-size: 11px; color: var(--muted); word-break: break-all; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 8px 0; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<h1>rascal run page <span class="badge">{{WORKSPACE}}</span>{{REBUILT_BADGE}}</h1>
<p class="meta">{{SUMMARY}}</p>

<h2>Timing</h2>
<table>
<thead><tr><th>#</th><th>step</th><th>op</th><th>status</th><th>duration</th><th style="width:40%">waterfall</th></tr></thead>
<tbody>
{{WATERFALL_ROWS}}
</tbody>
</table>

<h2>Filler and pack calls</h2>
{{CALLS}}

<h2>Steps</h2>
{{STEPS}}
</body>
</html>

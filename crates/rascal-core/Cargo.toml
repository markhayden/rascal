[package]
name = "rascal-core"
description = "rascal core: frames, locations, the mask record, renderings, recipes, workspace, op contracts (library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Path only, no version: the testkit may one day depend on this crate, and a dev-dependency
# without a version is dropped from the published manifest, which breaks any publish cycle.
rascal-testkit = { path = "../rascal-testkit" }
rascal-ops = { path = "../rascal-ops" }

# cargo-deny: the licences a dependency may carry, bans and sources. Anything outside this list
# fails `just check`. Advisories need the network and run in CI (`just deny-advisories`).
[graph]
all-features = true

[licenses]
# The list is the policy, not the inventory: an allowance no dependency uses yet is not a warning.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  "MPL-2.0",             # file-level copyleft; fine for a binary that does not modify such files
  "CDLA-Permissive-2.0", # root-certificate data bundled by the TLS platform verifier
]

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path-only dev-dependency has no version and counts as a wildcard. `cargo publish` drops it,
# which is how a crate's dev-dependency on the testkit avoids a publish cycle.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

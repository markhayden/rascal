# SAM 3's export environment (MODEL.md "SAM 3"): Sam3Model needs Transformers 5, which the shared
# export environment (`../pyproject.toml`, pinned below 5 for Tiny's export) does not have. Used
# once on a connected machine by `export.py --only sam3`; nothing here ships.
[project]
name = "rascal-tools-export-sam3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==5.22.1",
    "onnx>=1.17",
    "onnxruntime==1.31.1",
    "onnxscript>=0.7",
    "numpy>=2",
    "pillow>=11",
    "huggingface-hub>=1.0",
    "tokenizers>=0.22.2",
]

[tool.uv]
package = false

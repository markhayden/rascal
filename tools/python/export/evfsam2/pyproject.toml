# EVF-SAM2's export environment (PLAN.md 14.7): the maker's code (hustvl/EVF-SAM at a pinned
# commit, fetched and checked by `export/evfsam2.py`, not on PyPI) was written for Transformers
# 4.x and imports torchscale's BEiT-3, hydra and timm, which the main export environment does not
# pin. Used once on a connected machine; nothing here ships.
[project]
name = "rascal-tools-export-evfsam2"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers==4.51.3",
    "timm",
    "torchscale==0.2.0",
    "hydra-core>=1.3",
    "iopath>=0.1.10",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "numpy>=2",
    "pillow>=11",
    "huggingface-hub",
    "tokenizers>=0.21",
    "mcp>=1.2",
]

[tool.uv]
package = false

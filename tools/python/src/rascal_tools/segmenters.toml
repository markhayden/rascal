# The segmenter catalogue (SPEC.md "Choosable segmenters"; MODEL.md): one entry per model
# `segment` can run, chosen by its `model` argument. Files are named by reference to
# `artifacts.toml` (sizes, digests, URLs), so a file two models share is listed and installed
# once. `rank` is the preference order, best first: the ranks are 1 to the number of entries,
# each once (the owner's hand check of the five on seven prompts, 2026-11-10: sam3, birefnet,
# hqsam, evfsam2, tiny). There is no fixed default: a call that names no model (and a rascal
# config with no `[segment] model`) runs the best-ranked model that is installed, complete and
# runs on this platform; with none installed, the best-ranked that runs here, reported missing.
# A model named explicitly is run as named, never swapped. `params` are the `segment` parameters
# the model uses; a call that supplies another is refused. `lab` is copied from the round that
# measured the model (docs/results/segment-01.md defines `remove`). The entries are listed in
# rank order, for the reader; the rank decides.

[[segmenter]]
id = "sam3"
title = "SAM 3"
adapter = "sam3"
params = ["threshold", "max_instances"]
rank = 1
licence = "SAM License"
licence_files = ["LICENSE.sam3.txt"]
files = [
    "sam3.vision.onnx",
    "sam3.vision.onnx.data",
    "sam3.text.onnx",
    "sam3.head.onnx",
    "sam3.tokenizer.json",
]
download_mb = 3377
installed_mb = 3377
platforms = ["macos-arm64", "linux-x86_64"]
lab = { round = "segment-01", remove = 0.777, iou = 0.724, best_for = "the best remove score; end to end, it finds and draws each instance itself" }


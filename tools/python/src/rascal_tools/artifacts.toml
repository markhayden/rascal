# carries (SPEC.md "The Python pack and its bundle"; MODEL.md for the provenance of each).
# `name` is the file name in the cache; `sha256` is checked before and after a download, and
# by the pack before an artifact is used; `licence` is as MODEL.md records it. The files are
# published as release assets of the repository; a bundle holds them under models/. The file
# lives inside the package so an installed pack reads the same one.


[project]
name = "rascal-tools"
version = "0.1.0"
description = "The learned finders for rascal, as an MCP tool pack: a segmenter with a text prompt, and the harness that keeps its output honest."
readme = "MODEL.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # The protocol: the 1.x line speaks revision 2025-11-25, the one rascal requires (ADR 0015).
    "mcp>=1.30,<2",
    "pillow>=11",
    "numpy>=2",
]

[project.scripts]
rascal-tools = "rascal_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rascal_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["segmenter: needs the fetched model artifact; skipped when it is absent"]
addopts = "-q"

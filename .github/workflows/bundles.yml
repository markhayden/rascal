name: bundles

# The Python pack's release bundles (SPEC.md "The Python pack and its bundle"): on a version
# tag, one bundle per platform is built by scripts/build-bundle.sh on that platform's runner,
# packed as a tar.gz with its SHA-256 beside it, smoked by scripts/bundle-acceptance.sh from
# the packed archive, and uploaded to the tag's GitHub release (the one dist creates from the
# same tag). A bundle carries no model: models are a setup step (`rascal-tools get`, SPEC.md
# "Choosable segmenters"). The acceptance installs Tiny into the bundle's install from its
# release assets, fetched beforehand with the pack's own installer, with the network off, and
# segments with it; each job also runs Tiny's real-model tests, required, not skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: linux-x86_64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install uv and the pack's Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Sync the Python pack's environment
        run: uv sync --frozen --project tools/python
      - name: Tiny's release assets, fetched and verified (the network step)
        run: scripts/tiny-assets.sh "$RUNNER_TEMP/tiny-assets"
      - name: Tiny's real-model tests, required
        env:
          RASCAL_TOOLS_MODELS: ${{ runner.temp }}/models
          RASCAL_TOOLS_REQUIRE_MODELS: tiny
        run: |
          uv run --frozen --project tools/python rascal-tools get tiny --from "$RUNNER_TEMP/tiny-assets"
          uv run --frozen --project tools/python pytest tools/python/tests -m model_tiny
      - name: Allow an unprivileged network namespace (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo build --release -p rascal-mask
      - name: Build the bundle and pack it
        run: |
          scripts/build-bundle.sh ${{ matrix.platform }} bundle --archive rascal-tools-bundle-${{ matrix.platform }}.tar.gz
          shasum -a 256 rascal-tools-bundle-${{ matrix.platform }}.tar.gz > rascal-tools-bundle-${{ matrix.platform }}.tar.gz.sha256
          cat rascal-tools-bundle-${{ matrix.platform }}.tar.gz.sha256
      - name: Install from the packed archive with no network, install Tiny, and call the pack
        run: scripts/bundle-acceptance.sh target/release/rascal --archive rascal-tools-bundle-${{ matrix.platform }}.tar.gz --models "$RUNNER_TEMP/tiny-assets"
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then break; fi
            echo "waiting for the release $GITHUB_REF_NAME"; sleep 60
          done
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            rascal-tools-bundle-${{ matrix.platform }}.tar.gz rascal-tools-bundle-${{ matrix.platform }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rascal-tools-bundle-${{ matrix.platform }}
          path: rascal-tools-bundle-${{ matrix.platform }}.tar.gz*

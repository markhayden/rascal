[workspace]
resolver = "3"
members = [
  "crates/rascal-core",
  "crates/rascal-ops",
  "crates/rascal-mcp",
  "crates/rascal-testkit",
  "crates/rascal-mask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/markhayden/rascal"
rust-version = "1.99"

# The dependency list from SPEC.md "Tech stack". Everything the spec names is declared here so a
# later task adds one line to its crate manifest and nothing else; anything outside this list
# needs an ADR. Versions are the crates.io releases current on 2026-10-28. An entry no crate uses
# yet is absent from Cargo.lock until its first use. The MCP transport crate is decided in M3.

[workspace.dependencies]
rascal-core = { path = "crates/rascal-core", version = "0.1.0" }
rascal-ops = { path = "crates/rascal-ops", version = "0.1.0" }
rascal-mcp = { path = "crates/rascal-mcp", version = "0.1.0" }
rascal-testkit = { path = "crates/rascal-testkit", version = "0.1.0" }

clap = { version = "4.6", features = ["derive", "string"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
schemars = "1.2"
jsonschema = { version = "0.60", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.27", default-features = false }
rayon = "1.12"
sha2 = "0.11"
fs4 = "1.1"
tracing = "0.1"
# The MCP SDK (ADR 0015): pinned; stdio for `serve`, a child process for the packs; no macros.
# The shared contract of the waffle tools (ADR 0020): types and schemas, no logic; pinned exactly,
# moved by a deliberate commit (scripts/check-contract.sh warns in CI when a newer one exists).
table-manners = "=0.1.0"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "schemars"] }
# The subscriber behind RASCAL_LOG (SPEC "Diagnostics"): spans to stderr, off by default.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }
tar = "0.4"
flate2 = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "multipart"] }
# The TLS provider reqwest's rustls needs, installed by the HTTP filler; ring, not aws-lc, so
# the build needs no cmake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# The profile `dist` builds release archives with.
[profile.dist]
inherits = "release"
lto = "thin"

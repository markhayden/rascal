# The second round's matrix (docs/lab.md): every kept image through the seam recipe under the
# two masks (fan-v1 and fan-thin-v1) and two fillers, Bria Eraser on fal (hosted; the spend is
# an estimate per call) and LaMa locally. Run:
#   rascal lab run labs/seam-02/matrix.toml --config <rascal.toml with [fillers.bria-erase] and [fillers.lama]> \
#       --out lab/seam-02/ --corpus-root <the corpus files> --no-dash
version = 1
name = "seam-02"
corpus = "corpus.toml"

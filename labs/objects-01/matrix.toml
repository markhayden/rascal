# The fan-v1 arms name their set: when this ran the seam recipe defaulted to fan-v1; since
# 2026-10-30 it defaults to fan-v3, so the explicit override keeps the matrix reproducible.
[[arm]]
name = "ramp-v2-bria"
recipe = "seam"
overrides = { "fan.constants" = "fan-v2" }
filler = "bria-erase"
spend_usd_per_call = 0.04

[[arm]]
name = "ramp-bria"
recipe = "seam"
overrides = { "fan.constants" = "fan-v1" }
filler = "bria-erase"
spend_usd_per_call = 0.04
